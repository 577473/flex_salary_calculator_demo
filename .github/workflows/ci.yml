name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (RSpec + static analysis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Prepare test database
        run: bin/rails db:prepare
        env:
          RAILS_ENV: test
      - name: Lint (RuboCop)
        run: bundle exec rubocop
      - name: Security scan (Brakeman)
        run: bin/brakeman -q --no-pager
      - name: Dependency audit (bundler-audit)
        run: bundle exec bundler-audit check --update
      - name: Tests (RSpec + SimpleCov minimum coverage)
        run: bundle exec rspec

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Production build (Vite)
        run: npm run build